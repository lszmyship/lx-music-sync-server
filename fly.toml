app = 'lx-music-sync-server'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 9527
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
