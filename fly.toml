# fly.toml app configuration file generated for lx-music-sync-server
app = 'lx-music-sync-server'
primary_region = 'ams'
[build]
[http_service]
internal_port = 9527
force_https = true
# 长连接同步服务：禁止自动停机，否则空闲后机器被停，手机端口立即断
auto_stop_machines = false
auto_start_machines = true
# 至少常驻 1 台，避免"0 out of 1 machines left running"全部停掉
min_machines_running = 1
processes = ['app']
# 健康检查：让 Fly 知道服务真的活着，避免误判
[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/"
[[vm]]
size = 'shared-cpu-1x' # 即 1x CPU + 256MB，足够跑 lx 同步服务
# 如需更大内存可改用下面两行，但二者与 size 不要同时混用：
# cpu_kind = 'shared'
# cpus = 1
# memory_mb = 512
